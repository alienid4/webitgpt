  <text x="54" y="106" font-family="Microsoft JhengHei, Noto Sans TC, Arial" font-size="16" fill="#5f6b7a">從核心系統展開，對齊關聯系統、主機/IP 與通知對象。</text>

  <g font-family="Microsoft JhengHei, Noto Sans TC, Arial" font-size="15" font-weight="800">
