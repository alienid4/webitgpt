{% extends "base.html" %}
{% block title %}搜尋結果 - webitgpt{% endblock %}
{% block content %}
<section class="page-header">
  <div>
    <p class="card-title">GLOBAL SEARCH</p>
    <h1>搜尋結果</h1>
    <p class="muted">「{{ query }}」找到 {{ results|length }} 個入口。</p>
  </div>
</section>

<section class="admin-module-grid">
  {% for item in results %}
  <a class="admin-module-card" href="{{ item.url }}">
    <em>{{ item.group }}</em>
    <strong>{{ item.title }}</strong>
    <span>符合：{{ item.matched_keyword }}</span>
    <span class="text-muted-sm">角色：{{ item.role }}</span>
  </a>
  {% endfor %}
</section>
{% endblock %}
