{% extends "base.html" %}
{% block title %}備份 / DR - webitgpt{% endblock %}
{% block content %}
<section class="panel">
  <div class="page-header">
    <div>
      <p class="eyebrow">BACKUP / DR</p>
      <h1>備份 / DR</h1>
      <p class="text-muted-sm">產生備份 manifest 與 DR dry-run；正式還原仍需人工確認與變更紀錄。</p>
    </div>
    <div class="actions">
      <a class="btn secondary" href="{{ url_for('api_superadmin.superadmin_page') }}">返回系統管理</a>
      <button class="btn primary" type="button" data-busy-text="產生中" data-submit-message="正在產生備份 manifest，請稍候。" data-api-post="/api/superadmin/backup/manifest">產生備份 manifest</button>
      <button class="btn" type="button" data-busy-text="試跑中" data-submit-message="正在執行 DR dry-run，請稍候。" data-api-post="/api/superadmin/dr-drill">執行 DR dry-run</button>
    </div>
  </div>
  <pre class="detail" id="apiResult"></pre>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/admin_tools.js') }}"></script>{% endblock %}
