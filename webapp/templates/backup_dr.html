{% extends "base.html" %}
{% block title %}備份 / DR - webitgpt{% endblock %}
{% block content %}
<section class="panel">
  <div class="page-header">
    <div>
      <p class="eyebrow">BACKUP / DR</p>
      <h1>備份 / DR</h1>
      <p class="text-muted-sm">目前提供備份 manifest 與 DR dry-run 檢查；真正還原仍需人工核准。</p>
    </div>
    <div class="actions">
      <a class="btn secondary" href="{{ url_for('api_superadmin.superadmin_page') }}">回管理總覽</a>
      <button class="btn primary" type="button" data-api-post="/api/superadmin/backup/manifest">建立備份清單</button>
      <button class="btn" type="button" data-api-post="/api/superadmin/dr-drill">執行 DR dry-run</button>
    </div>
  </div>
  <pre class="detail" id="apiResult"></pre>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/admin_tools.js') }}"></script>{% endblock %}
